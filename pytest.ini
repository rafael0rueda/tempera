[pytest]
testpaths = tests
# What is known and waiting on GTK or PyGObject, so that a new warning stands out.
filterwarnings =
    ignore:Gdk\.cairo_set_source_pixbuf is deprecated:DeprecationWarning
    ignore:Gdk\.pixbuf_get_from_surface is deprecated:DeprecationWarning
    ignore:Gdk\.pixbuf_get_from_texture is deprecated:DeprecationWarning
    ignore:'asyncio\..*' is deprecated:DeprecationWarning:gi\.events
    ignore:GLib\.unix_signal_add_full is deprecated
